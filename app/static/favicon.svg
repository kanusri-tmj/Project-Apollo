<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Heart disease risk model">
  <title>Heart disease risk model</title>
  <desc>A white heart over a logistic sigmoid curve, on the project's red gradient. The curve is the model, the heart is the subject.</desc>

  <defs>
    <!-- Identical to the header brand mark: .brand .dot in index.html -->
    <linearGradient id="tile" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#d81f36"/>
      <stop offset="1" stop-color="#a8162a"/>
    </linearGradient>
  </defs>

  <!-- Brand tile -->
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>

  <!-- Logistic (sigmoid) risk curve, sitting behind the heart.
       Only the lower-left and upper-right tails stay visible; the middle is
       deliberately hidden by the heart so the silhouette reads at 16 px. -->
  <path d="M4 56 C 18 56, 21 46, 30 36 C 39 26, 42 16, 60 16"
        fill="none" stroke="#ffffff" stroke-opacity="0.34"
        stroke-width="4.5" stroke-linecap="round"/>

  <!-- Heart: point at (32, 46.8), fitted to the tile with a 13 px margin -->
  <path d="M32 46.8 C 32 46.8, 13.6 34.8, 13.6 24.4 C 13.6 17.6, 19.6 13.2, 24.8 13.2
           C 28 13.2, 30.4 15.12, 32 17.6 C 33.6 15.12, 36 13.2, 39.2 13.2
           C 44.4 13.2, 50.4 17.6, 50.4 24.4 C 50.4 34.8, 32 46.8, 32 46.8 Z"
        fill="#ffffff"/>
</svg>
